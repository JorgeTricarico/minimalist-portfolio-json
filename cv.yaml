cv:
  name: Jorge Tricarico
  headline: AI-Driven QA Engineer
  photo: public/perfil_rounded.png
  location: Buenos Aires, AR
  email: jorge.tricarico@gmail.com
  phone: +54 9 11 50479769
  social_networks:
    - network: LinkedIn
      username: jorge-tricarico
    - network: GitHub
      username: JorgeTricarico
  sections:
    Resumen:
      - >-
        Ingeniero QA y Especialista en IA enfocado en la creación de producto y
        la confiabilidad del software. Cuento con un perfil técnico full-stack
        que potencio mediante el uso avanzado de LLMs y herramientas agenticas.
        Me especializo en liderar la automatización en entornos dinámicos,
        compensando limitaciones de recursos mediante arquitecturas innovadoras
        y optimizando la entrega de valor con total autonomía técnica.
    Experiencia:
      - company: OneVisa - Dubai (UAE) / España
        position: (Part-time) Senior Principal QA Engineer (AI & Reliability)
        start_date: 2026-02
        end_date: 2026-08
        highlights:
          - >-
            Único QA en startup de alto crecimiento: arquitectura de testing y
            confiabilidad de 0 a 100% con Claude Code.
          - >-
            Entrega de Agente QA autónomo funcional en producción para pruebas
            E2E de toda la empresa y evolución continua.
          - >-
            Pipelines con autodiagnóstico iterativo y métricas DORA, escalando
            cobertura entre múltiples squads técnicos.
      - company: Tata Consultancy Service - Banco Galicia
        position: SSR QA Automation Engineer
        start_date: 2023-04
        end_date: present
        highlights:
          - >-
            Liderazgo en Tribu Herramientas y Datos y Embajador de IA en Grupo
            Hub AI: automatización Web/API con Tricentis TOSCA y arquitectura de
            KrakenQA (agente modular en VS Code para Apps Android/iOS
            resolviendo la fricción de TOSCA Mobile).
          - >-
            Promoción a SSR tras liderar QA técnico en Onboarding y
            Transferencias Minoristas en la app móvil transaccional.
          - >-
            Co-creador de CobroTron y FullTron: patrón pionero de auto-debug por
            DOM filtrado, generación de suites POM y sincronización desatendida
            con ALM.
      - company: Ada School - Colombia
        position: Profesor Python (BootCamp Data y FullStack)
        start_date: 2023-09
        end_date: 2024-10
        highlights:
          - >-
            Mentoría técnica avanzada en Python enfocada en la calidad del
            código, arquitectura de software y mejores prácticas de desarrollo
            para perfiles internacionales.
    Educación:
      - institution: Universidad Nacional de Hurlingham
        area: Inteligencia Artificial
        degree: Tec. Universitaria
        start_date: 2024-01
        end_date: present
      - institution: Instituto Superior de Formación Docente N°109
        area: Economía y Gestión
        degree: Prof. de Educación Secundaria
        start_date: 2019-03
        end_date: 2023-12
        highlights:
          - Adeudo último año
    Habilidades:
      - label: IA & Agentes
        details: >-
          Claude Code, Gemini, DeepSeek, Scikit-learn, GitHub Copilot, Cursor,
          Antigravity, Engram, Prompt Engineering, OpenAI, Anthropic, Pandas,
          NumPy
      - label: Testing & QA
        details: >-
          Tricentis Tosca, Playwright, Cypress, Selenium, Appium, Pytest, k6
          (Performance), Postman, Bruno
      - label: Dev & Ops
        details: >-
          Python, TypeScript, JavaScript, Java, Node.js, FastAPI, Flask, AWS,
          Docker, Jenkins, Linux, Bash, CI/CD
      - label: Observabilidad & Data
        details: >-
          Grafana, Kibana, SQL, NoSQL, Matplotlib, Seaborn, Análisis de
          Traces/Logs, GitHub Actions
      - label: Idiomas
        details: Español, Inglés
    Proyectos:
      - name: Zenco.arg (En Prod)
        isActive: 'true'
        description: >-
          Plataforma de modernización para emprendimientos de diseño y arreglos
          de ropa. Incluye un Dashboard Web premium para gestión de órdenes y un
          Bot de WhatsApp con IA (Gemini) que atiende clientes y consulta
          estados de pedidos de forma autónoma.
        highlights:
          - React 18 · Node.js · AI WhatsApp Bot · Gemini AI
        url: https://github.com/JorgeTricarico/platform
        github: https://github.com/JorgeTricarico/platform
        imageLight: /zenko_light.png
        imageDark: /zenko_dark.png
      - name: El Industrial (En Prod)
        isActive: 'true'
        description: >-
          Sistema de automatización de precios para suministros industriales.
          Gestiona telemetría de alta frecuencia desde la API de Bertual, aplica
          protección de márgenes y genera reportes ejecutivos diarios con IA
          enviados por Telegram.
        highlights:
          - Python · Vanilla JS · API REST · Telegram Bot · IA Reporting
        url: https://github.com/JorgeTricarico/El-Industrial
        github: https://github.com/JorgeTricarico/El-Industrial
        imageLight: /industrial_light.png
        imageDark: /industrial_dark.png
      - name: Portfolio CV (Live)
        isActive: 'true'
        description: >-
          Versión altamente personalizada y mejorada del fork original. Integra
          la tecnología de RenderCV para la generación de PDFs optimizados para
          sistemas ATS. Implementé un sistema multi-idioma (i18n), modo oscuro
          avanzado con detección automática, paleta de comandos interactiva
          (Ctrl+K) y una interfaz premium con efectos ambient-blur.
        highlights:
          - >-
            JSON Resume · Astro · RenderCV (ATS Friendly) · i18n · Advanced Dark
            Mode
        url: https://github.com/JorgeTricarico/minimalist-portfolio-json
        github: https://github.com/JorgeTricarico/minimalist-portfolio-json
design:
  theme: classic
  page:
    size: a4
    top_margin: 1.0cm
    bottom_margin: 1.0cm
